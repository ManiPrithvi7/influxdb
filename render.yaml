# Blueprint spec: https://render.com/docs/blueprint-spec
#
# This file applies only after you link it with Dashboard → Blueprints (IaC).
# A normal Web Service hooked to Git does NOT read render.yaml — see RENDER_DEPLOY.md
# if logs still show `go build` (native Go runtime). Disable auto-deploy on that old
# service once Blueprint/Docker service exists so pushes stop triggering Go builds.
#
# InfluxDB listens on Render PORT via INFLUXD_HTTP_BIND_ADDRESS (not default 8086).
# Secrets: set DOCKER_INFLUXDB_INIT_PASSWORD and DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
# in the dashboard when prompted (sync: false).
#
# Persistence: only paths under disk.mountPath survive restarts/redeploys.
services:
  - type: web
    # Match your Render dashboard Web Service name exactly so Blueprint sync can
    # replace Go with Docker on that resource; rename here if yours differs.
    name: influxdb
    repo: https://github.com/ManiPrithvi7/influxdb
    branch: main
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    numInstances: 1
    maxShutdownDelaySeconds: 120
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: INFLUXD_HTTP_BIND_ADDRESS
        value: ":10000"
      - key: DOCKER_INFLUXDB_INIT_MODE
        value: setup
      - key: DOCKER_INFLUXDB_INIT_USERNAME
        value: admin
      - key: DOCKER_INFLUXDB_INIT_PASSWORD
        sync: false
      - key: DOCKER_INFLUXDB_INIT_ORG
        value: statsmqtt
      - key: DOCKER_INFLUXDB_INIT_BUCKET
        value: metrics
      - key: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
        sync: false
    disk:
      name: influxdb-data
      mountPath: /var/lib/influxdb2
      sizeGB: 10
